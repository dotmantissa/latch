[project]
name = "latch"
version = "0.1.0"
description = "Latch runtime feasibility tools"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "playwright==1.64.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
